<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FASTA Analyzer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    h1 { color: #333; }
    #output { margin-top: 20px; }
    table { border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: center; }
    th { background: #f2f2f2; }
  </style>
</head>
<body>
  <h1>FASTA File Analyzer</h1>
  <input type="file" id="fastaFile" accept=".fasta,.fa" />
  <div id="output"></div>

  <script>
    function calculatePercentages(seq) {
      let letters = seq.replace(/[^A-Za-z]/g, "").toUpperCase().split("");
      let total = letters.length;
      let counts = {};

      letters.forEach(l => {
        counts[l] = (counts[l] || 0) + 1;
      });

      let percentages = {};
      Object.keys(counts).sort().forEach(l => {
        percentages[l] = (counts[l] / total * 100).toFixed(2);
      });

      return percentages;
    }

    document.getElementById("fastaFile").addEventListener("change", function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        const seq = text.split("\n").filter(line => !line.startsWith(">")).join("");
        const percentages = calculatePercentages(seq);

        let output = "<h2>Results</h2>";
        output += "<table><tr><th>Symbol</th><th>Percentage (%)</th></tr>";
        for (let l in percentages) {
          output += `<tr><td>${l}</td><td>${percentages[l]}</td></tr>`;
        }
        output += "</table>";
        document.getElementById("output").innerHTML = output;
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
